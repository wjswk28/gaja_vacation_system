{% extends "base.html" %}
{% block title %}실습학생 등록{% endblock %}

{% block content %}
<div class="max-w-4xl mx-auto px-4 py-6 space-y-6">

  <div class="flex flex-col items-center justify-center mb-2">
    <div class="w-16 h-16 rounded-full bg-rose-100 flex items-center justify-center shadow-sm mb-2">
      <i data-lucide="graduation-cap" class="w-8 h-8 text-rose-700"></i>
    </div>
    <h1 class="text-2xl md:text-3xl font-extrabold text-rose-700 tracking-tight">
      실습학생 등록
    </h1>
  </div>

  <div class="bg-white border border-rose-100 rounded-3xl shadow-sm p-5">
    <form method="post" class="grid grid-cols-1 md:grid-cols-4 gap-3">
      <div class="md:col-span-1">
        <label class="block text-sm font-semibold text-slate-700 mb-1">이름</label>
        <input type="text" name="name" required
               class="w-full rounded-xl border border-slate-200 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-rose-300">
      </div>

      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-1">시작일</label>
        <input type="date" name="start_date" required
               class="w-full rounded-xl border border-slate-200 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-rose-300">
      </div>

      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-1">종료일</label>
        <input type="date" name="end_date" required
               class="w-full rounded-xl border border-slate-200 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-rose-300">
      </div>

      <div class="flex items-end">
        <button type="submit"
                class="w-full rounded-xl bg-rose-500 hover:bg-rose-600 text-white font-bold px-4 py-2.5 transition">
          등록
        </button>
      </div>
    </form>
  </div>

  <div class="bg-white border border-sky-100 rounded-3xl shadow-sm p-5">
    <div class="flex items-center justify-between mb-4">
      <h2 class="text-lg font-extrabold text-sky-800">등록된 실습학생</h2>
      <a href="{{ url_for('calendar.meal_check_page') }}"
         class="text-sm font-semibold text-sky-700 hover:text-sky-900">식수 페이지로 돌아가기</a>
    </div>

    {% if students %}
      <div class="space-y-3">
        {% for s in students %}
        <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-3 rounded-2xl border border-slate-100 bg-slate-50 px-4 py-3">
          <div class="flex flex-col">
            <span class="font-extrabold text-slate-800">{{ s.name }}</span>
            <span class="text-sm text-slate-500">{{ s.start_date }} ~ {{ s.end_date }}</span>
          </div>

          <form method="post" action="{{ url_for('calendar.delete_meal_student', student_id=s.id) }}"
                onsubmit="return confirm('이 실습학생을 삭제할까요?');">
            <button type="submit"
                    class="rounded-xl bg-slate-200 hover:bg-slate-300 text-slate-800 font-semibold px-4 py-2 transition">
              삭제
            </button>
          </form>
        </div>
        {% endfor %}
      </div>
    {% else %}
      <div class="rounded-2xl bg-slate-50 border border-slate-100 px-4 py-8 text-center text-slate-500 font-semibold">
        등록된 실습학생이 없습니다.
      </div>
    {% endif %}
  </div>
</div>
{% endblock %}
